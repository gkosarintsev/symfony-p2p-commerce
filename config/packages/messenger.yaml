framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            query.bus: ~
            event.bus:
                default_middleware: allow_no_handlers

        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Domain\Notification\Message\SendPurchaseNotificationMessage': async
            'App\Domain\Ledger\Message\GenerateReceiptPdfMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
